name: Daily Liquidity Summary to Telegram

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get today date (US Eastern)
        id: date
        run: |
          TZ=America/New_York date +'%Y-%m-%d' > date.txt
          echo "today=$(cat date.txt)" >> $GITHUB_OUTPUT

      - name: Prepare and send message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing"
            exit 1
          fi

          FILE="daily/${TODAY}.md"

          if [ -f "$FILE" ]; then
            echo "Found daily report: $FILE"

            # Build structured message
            {
              echo "📊 *美股流动性每日观测*"
              echo "📅 ${TODAY}"
              echo ""
              echo "*状态概览*"

              # Try to extract key info
              STATUS=$(grep -E '综合状态|市场状态' "$FILE" | head -1 | sed 's/.*[：:]//' | xargs || true)
              SPX=$(grep -iE 'SPX' "$FILE" | head -1 | sed 's/.*[：:]//' | xargs || true)
              GEX=$(grep -iE 'GEX' "$FILE" | head -1 | sed 's/.*[：:]//' | xargs || true)
              VVIX=$(grep -iE 'VVIX' "$FILE" | head -1 | sed 's/.*[：:]//' | xargs || true)

              [ -n "$STATUS" ] && echo "• 综合状态：*${STATUS}*"
              [ -n "$SPX" ] && echo "• SPX：${SPX}"
              [ -n "$GEX" ] && echo "• GEX：${GEX}"
              [ -n "$VVIX" ] && echo "• VVIX：${VVIX}"

              echo ""
              echo "*详细内容*"
              # Take the last part of the file as conclusion (usually the summary)
              tail -40 "$FILE" | head -c 2600
              echo ""
              echo "——"
              echo "🔗 完整记录：https://github.com/zfzfboom/us-equity-liquidity-monitor/blob/main/daily/${TODAY}.md"
            } > message.txt

          else
            echo "No daily report found for $TODAY"

            {
              echo "🚨 *美股流动性观测提醒*"
              echo "📅 ${TODAY}"
              echo ""
              echo "今日尚未提交观测记录。"
              echo ""
              echo "*请完成以下步骤：*"
              echo "1. 填写每日检查清单"
              echo "2. 使用模板创建 daily/${TODAY}.md"
              echo "3. 提交到仓库"
              echo ""
              echo "📋 检查清单："
              echo "https://github.com/zfzfboom/us-equity-liquidity-monitor/blob/main/checklist/daily-checklist.md"
              echo ""
              echo "📝 总结模板："
              echo "https://github.com/zfzfboom/us-equity-liquidity-monitor/blob/main/daily/template.md"
              echo ""
              echo "提交后可在 Actions 页面手动触发立即推送。"
            } > message.txt
          fi

          # Send message
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(cat message.txt)" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "disable_web_page_preview=true"

          echo "Message sent successfully"
