name: Daily Liquidity Summary to Telegram

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get today date (US Eastern)
        id: date
        run: |
          TZ=America/New_York date +'%Y-%m-%d' > date.txt
          echo "today=$(cat date.txt)" >> $GITHUB_OUTPUT

      - name: Fetch market data (VIX + VVIX + SPX + GEX)
        id: market
        run: |
          set +e

          fetch_yahoo() {
            local symbol=$1
            curl -s --max-time 15 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: application/json" \
              "https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=5d"
          }

          parse_yahoo() {
            local json=$1
            local field=$2
            echo "$json" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    m = d['chart']['result'][0]['meta']
    v = m.get('$field', '')
    print(v if v is not None else '')
except Exception:
    print('')
" 2>/dev/null
          }

          # ---- VIX ----
          VIX_JSON=$(fetch_yahoo "%5EVIX")
          VIX=$(parse_yahoo "$VIX_JSON" "regularMarketPrice")
          VIX_CHG=$(parse_yahoo "$VIX_JSON" "regularMarketChangePercent")
          [ -z "$VIX" ] && VIX="N/A"
          [ -z "$VIX_CHG" ] && VIX_CHG="N/A"

          # ---- VVIX ----
          VVIX_JSON=$(fetch_yahoo "%5EVVIX")
          VVIX=$(parse_yahoo "$VVIX_JSON" "regularMarketPrice")
          VVIX_CHG=$(parse_yahoo "$VVIX_JSON" "regularMarketChangePercent")
          [ -z "$VVIX" ] && VVIX="N/A"
          [ -z "$VVIX_CHG" ] && VVIX_CHG="N/A"

          # ---- SPX ----
          SPX_JSON=$(fetch_yahoo "%5EGSPC")
          SPX=$(parse_yahoo "$SPX_JSON" "regularMarketPrice")
          [ -z "$SPX" ] && SPX="N/A"

          # Format change
          format_chg() {
            local v=$1
            if [[ "$v" =~ ^-?[0-9]*\.?[0-9]+$ ]]; then
              printf "%+.2f%%" "$v"
            else
              echo "N/A"
            fi
          }
          VIX_CHG_FMT=$(format_chg "$VIX_CHG")
          VVIX_CHG_FMT=$(format_chg "$VVIX_CHG")

          # ---- GEX from AlgoxFlow (SPY) ----
          GEX_JSON=$(curl -s --max-time 12 "https://algoxflow.com/api/gexmap?ticker=SPY")
          REGIME=$(echo "$GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('regime',''))" 2>/dev/null || echo "")
          TOTAL_GEX=$(echo "$GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('totalGex',''))" 2>/dev/null || echo "")
          CALL_WALL=$(echo "$GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('callWall',''))" 2>/dev/null || echo "")
          PUT_WALL=$(echo "$GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('putWall',''))" 2>/dev/null || echo "")

          # ---- Open SPX GEX levels ----
          SPX_GEX_JSON=$(curl -s --max-time 12 "https://raw.githubusercontent.com/dhawalc/spx-gamma-levels/main/data/latest.json")
          SPX_REGIME=$(echo "$SPX_GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('gamma_regime',''))" 2>/dev/null || echo "")
          SPX_FLIP=$(echo "$SPX_GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('zero_gamma_flip'); print(f'{v:.0f}' if isinstance(v,(int,float)) else '')" 2>/dev/null || echo "")
          SPX_CALL_WALL=$(echo "$SPX_GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('call_wall'); print(f'{v:.0f}' if isinstance(v,(int,float)) else '')" 2>/dev/null || echo "")
          SPX_PUT_WALL=$(echo "$SPX_GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('put_wall'); print(f'{v:.0f}' if isinstance(v,(int,float)) else '')" 2>/dev/null || echo "")
          SPX_NET_GEX_BN=$(echo "$SPX_GEX_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('net_gex_dollars'); print(f'{v/1e9:.1f}' if isinstance(v,(int,float)) else '')" 2>/dev/null || echo "")

          # Defaults
          [ -z "$REGIME" ] && REGIME="N/A"
          [ -z "$TOTAL_GEX" ] && TOTAL_GEX="N/A"
          [ -z "$CALL_WALL" ] && CALL_WALL="N/A"
          [ -z "$PUT_WALL" ] && PUT_WALL="N/A"
          [ -z "$SPX_REGIME" ] && SPX_REGIME="N/A"
          [ -z "$SPX_FLIP" ] && SPX_FLIP="N/A"
          [ -z "$SPX_CALL_WALL" ] && SPX_CALL_WALL="N/A"
          [ -z "$SPX_PUT_WALL" ] && SPX_PUT_WALL="N/A"
          [ -z "$SPX_NET_GEX_BN" ] && SPX_NET_GEX_BN="N/A"

          echo "vix=$VIX" >> $GITHUB_OUTPUT
          echo "vix_chg=$VIX_CHG_FMT" >> $GITHUB_OUTPUT
          echo "vvix=$VVIX" >> $GITHUB_OUTPUT
          echo "vvix_chg=$VVIX_CHG_FMT" >> $GITHUB_OUTPUT
          echo "spx=$SPX" >> $GITHUB_OUTPUT
          echo "regime=$REGIME" >> $GITHUB_OUTPUT
          echo "total_gex=$TOTAL_GEX" >> $GITHUB_OUTPUT
          echo "call_wall=$CALL_WALL" >> $GITHUB_OUTPUT
          echo "put_wall=$PUT_WALL" >> $GITHUB_OUTPUT
          echo "spx_regime=$SPX_REGIME" >> $GITHUB_OUTPUT
          echo "spx_flip=$SPX_FLIP" >> $GITHUB_OUTPUT
          echo "spx_call_wall=$SPX_CALL_WALL" >> $GITHUB_OUTPUT
          echo "spx_put_wall=$SPX_PUT_WALL" >> $GITHUB_OUTPUT
          echo "spx_net_gex_bn=$SPX_NET_GEX_BN" >> $GITHUB_OUTPUT

          echo "=== DEBUG ==="
          echo "VIX=$VIX ($VIX_CHG_FMT) | VVIX=$VVIX ($VVIX_CHG_FMT) | SPX=$SPX"
          echo "SPX Regime=$SPX_REGIME | Flip=$SPX_FLIP | NetGEX=$SPX_NET_GEX_BN Bn"

      - name: Prepare and send message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODAY: ${{ steps.date.outputs.today }}
          VIX: ${{ steps.market.outputs.vix }}
          VIX_CHG: ${{ steps.market.outputs.vix_chg }}
          VVIX: ${{ steps.market.outputs.vvix }}
          VVIX_CHG: ${{ steps.market.outputs.vvix_chg }}
          SPX: ${{ steps.market.outputs.spx }}
          REGIME: ${{ steps.market.outputs.regime }}
          TOTAL_GEX: ${{ steps.market.outputs.total_gex }}
          CALL_WALL: ${{ steps.market.outputs.call_wall }}
          PUT_WALL: ${{ steps.market.outputs.put_wall }}
          SPX_REGIME: ${{ steps.market.outputs.spx_regime }}
          SPX_FLIP: ${{ steps.market.outputs.spx_flip }}
          SPX_CALL_WALL: ${{ steps.market.outputs.spx_call_wall }}
          SPX_PUT_WALL: ${{ steps.market.outputs.spx_put_wall }}
          SPX_NET_GEX_BN: ${{ steps.market.outputs.spx_net_gex_bn }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: secrets missing"
            exit 1
          fi

          FILE="daily/${TODAY}.md"

          {
            echo "📊 *美股流动性每日观测*"
            echo "📅 ${TODAY}"
            echo ""
            echo "*市场快照*"
            echo "• SPX：${SPX}"
            echo "• VIX：${VIX}  (${VIX_CHG})"
            echo "• VVIX：${VVIX}  (${VVIX_CHG})"
            echo ""
            echo "*GEX 结构（自动）*"
            echo "• SPX Regime：*${SPX_REGIME}*"
            echo "• Net GEX：${SPX_NET_GEX_BN} Bn"
            echo "• Zero Gamma Flip：${SPX_FLIP}"
            echo "• Call Wall：${SPX_CALL_WALL}"
            echo "• Put Wall：${SPX_PUT_WALL}"
            echo ""
            echo "• SPY Regime：${REGIME} (GEX ${TOTAL_GEX})"
            echo "• SPY Call/Put Wall：${CALL_WALL} / ${PUT_WALL}"
            echo ""

            if [ -f "$FILE" ]; then
              echo "*人工判断*"
              STATUS=$(grep -E '综合状态|市场状态' "$FILE" | head -1 | sed 's/.*[：:]//' | xargs || true)
              [ -n "$STATUS" ] && echo "• 综合状态：*${STATUS}*"
              echo ""
              echo "*详细内容*"
              tail -30 "$FILE" | head -c 1600
              echo ""
              echo "——"
              echo "🔗 完整记录：https://github.com/zfzfboom/us-equity-liquidity-monitor/blob/main/daily/${TODAY}.md"
            else
              echo "⚠️ 今日尚未提交完整人工观测记录"
              echo ""
              echo "请补充期限结构、Skew、盘口等信号后提交 daily/${TODAY}.md"
              echo ""
              echo "📋 检查清单：https://github.com/zfzfboom/us-equity-liquidity-monitor/blob/main/checklist/daily-checklist.md"
            fi
          } > message.txt

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(cat message.txt)" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "disable_web_page_preview=true"

          echo "Message sent successfully"
