name: Daily Liquidity Summary to Telegram

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get today date (US Eastern)
        id: date
        run: |
          TZ=America/New_York date +'%Y-%m-%d' > date.txt
          echo "today=$(cat date.txt)" >> $GITHUB_OUTPUT

      - name: Fetch market data (VIX + SPX + GEX)
        id: market
        run: |
          set +e

          # ---- VIX ----
          VIX_JSON=$(curl -s --max-time 10 "https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?interval=1d&range=1d")
          VIX=$(echo "$VIX_JSON" | grep -o '"regularMarketPrice":[0-9.]*' | head -1 | cut -d: -f2)
          [ -z "$VIX" ] && VIX="N/A"

          # ---- SPX ----
          SPX_JSON=$(curl -s --max-time 10 "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1d&range=1d")
          SPX=$(echo "$SPX_JSON" | grep -o '"regularMarketPrice":[0-9.]*' | head -1 | cut -d: -f2)
          [ -z "$SPX" ] && SPX="N/A"

          # ---- GEX from AlgoxFlow (SPY proxy) ----
          GEX_JSON=$(curl -s --max-time 10 "https://algoxflow.com/api/gexmap?ticker=SPY")
          REGIME=$(echo "$GEX_JSON" | grep -o '"regime":"[^"]*"' | head -1 | cut -d'"' -f4)
          TOTAL_GEX=$(echo "$GEX_JSON" | grep -o '"totalGex":[-0-9.]*' | head -1 | cut -d: -f2)
          CALL_WALL=$(echo "$GEX_JSON" | grep -o '"callWall":[0-9.]*' | head -1 | cut -d: -f2)
          PUT_WALL=$(echo "$GEX_JSON" | grep -o '"putWall":[0-9.]*' | head -1 | cut -d: -f2)
          FLIP=$(echo "$GEX_JSON" | grep -o '"flip":[0-9.null]*' | head -1 | cut -d: -f2)

          # ---- Open SPX GEX levels (GitHub) ----
          SPX_GEX_JSON=$(curl -s --max-time 10 "https://raw.githubusercontent.com/dhawalc/spx-gamma-levels/main/data/latest.json")
          SPX_REGIME=$(echo "$SPX_GEX_JSON" | grep -o '"gamma_regime": "[^"]*"' | head -1 | cut -d'"' -f4)
          SPX_FLIP=$(echo "$SPX_GEX_JSON" | grep -o '"zero_gamma_flip": [0-9.]*' | head -1 | awk '{print $2}')
          SPX_CALL_WALL=$(echo "$SPX_GEX_JSON" | grep -o '"call_wall": [0-9.]*' | head -1 | awk '{print $2}')
          SPX_PUT_WALL=$(echo "$SPX_GEX_JSON" | grep -o '"put_wall": [0-9.]*' | head -1 | awk '{print $2}')
          SPX_NET_GEX=$(echo "$SPX_GEX_JSON" | grep -o '"net_gex_dollars": [-0-9.e+]*' | head -1 | awk '{print $2}')

          # Defaults
          [ -z "$REGIME" ] && REGIME="N/A"
          [ -z "$TOTAL_GEX" ] && TOTAL_GEX="N/A"
          [ -z "$CALL_WALL" ] && CALL_WALL="N/A"
          [ -z "$PUT_WALL" ] && PUT_WALL="N/A"
          [ -z "$FLIP" ] || [ "$FLIP" = "null" ] && FLIP="N/A"
          [ -z "$SPX_REGIME" ] && SPX_REGIME="N/A"
          [ -z "$SPX_FLIP" ] && SPX_FLIP="N/A"
          [ -z "$SPX_CALL_WALL" ] && SPX_CALL_WALL="N/A"
          [ -z "$SPX_PUT_WALL" ] && SPX_PUT_WALL="N/A"

          # Format net GEX roughly in billions if available
          if [[ "$SPX_NET_GEX" =~ ^-?[0-9] ]]; then
            SPX_NET_GEX_BN=$(echo "$SPX_NET_GEX" | awk '{printf "%.1f", $1/1e9}')
          else
            SPX_NET_GEX_BN="N/A"
          fi

          echo "vix=$VIX" >> $GITHUB_OUTPUT
          echo "spx=$SPX" >> $GITHUB_OUTPUT
          echo "regime=$REGIME" >> $GITHUB_OUTPUT
          echo "total_gex=$TOTAL_GEX" >> $GITHUB_OUTPUT
          echo "call_wall=$CALL_WALL" >> $GITHUB_OUTPUT
          echo "put_wall=$PUT_WALL" >> $GITHUB_OUTPUT
          echo "flip=$FLIP" >> $GITHUB_OUTPUT
          echo "spx_regime=$SPX_REGIME" >> $GITHUB_OUTPUT
          echo "spx_flip=$SPX_FLIP" >> $GITHUB_OUTPUT
          echo "spx_call_wall=$SPX_CALL_WALL" >> $GITHUB_OUTPUT
          echo "spx_put_wall=$SPX_PUT_WALL" >> $GITHUB_OUTPUT
          echo "spx_net_gex_bn=$SPX_NET_GEX_BN" >> $GITHUB_OUTPUT

          echo "VIX=$VIX | SPX=$SPX | SPY Regime=$REGIME | SPX Regime=$SPX_REGIME | Flip=$SPX_FLIP"

      - name: Prepare and send message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODAY: ${{ steps.date.outputs.today }}
          VIX: ${{ steps.market.outputs.vix }}
          SPX: ${{ steps.market.outputs.spx }}
          REGIME: ${{ steps.market.outputs.regime }}
          TOTAL_GEX: ${{ steps.market.outputs.total_gex }}
          CALL_WALL: ${{ steps.market.outputs.call_wall }}
          PUT_WALL: ${{ steps.market.outputs.put_wall }}
          FLIP: ${{ steps.market.outputs.flip }}
          SPX_REGIME: ${{ steps.market.outputs.spx_regime }}
          SPX_FLIP: ${{ steps.market.outputs.spx_flip }}
          SPX_CALL_WALL: ${{ steps.market.outputs.spx_call_wall }}
          SPX_PUT_WALL: ${{ steps.market.outputs.spx_put_wall }}
          SPX_NET_GEX_BN: ${{ steps.market.outputs.spx_net_gex_bn }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: secrets missing"
            exit 1
          fi

          FILE="daily/${TODAY}.md"

          {
            echo "📊 *美股流动性每日观测*"
            echo "📅 ${TODAY}"
            echo ""
            echo "*市场快照*"
            echo "• SPX：${SPX}"
            echo "• VIX：${VIX}"
            echo ""
            echo "*GEX 结构（自动）*"
            echo "• SPX Regime：*${SPX_REGIME}*"
            echo "• Net GEX：${SPX_NET_GEX_BN} Bn"
            echo "• Zero Gamma Flip：${SPX_FLIP}"
            echo "• Call Wall：${SPX_CALL_WALL}"
            echo "• Put Wall：${SPX_PUT_WALL}"
            echo ""
            echo "• SPY Regime：${REGIME} (GEX ${TOTAL_GEX})"
            echo "• SPY Call/Put Wall：${CALL_WALL} / ${PUT_WALL}"
            echo ""

            if [ -f "$FILE" ]; then
              echo "*人工判断*"
              STATUS=$(grep -E '综合状态|市场状态' "$FILE" | head -1 | sed 's/.*[：:]//' | xargs || true)
              VVIX=$(grep -iE 'VVIX' "$FILE" | head -1 | sed 's/.*[：:]//' | xargs || true)
              [ -n "$STATUS" ] && echo "• 综合状态：*${STATUS}*"
              [ -n "$VVIX" ] && echo "• VVIX：${VVIX}"
              echo ""
              echo "*详细内容*"
              tail -30 "$FILE" | head -c 1800
              echo ""
              echo "——"
              echo "🔗 完整记录：https://github.com/zfzfboom/us-equity-liquidity-monitor/blob/main/daily/${TODAY}.md"
            else
              echo "⚠️ 今日尚未提交完整人工观测记录"
              echo ""
              echo "请补充 VVIX、Skew、期限结构、盘口等二阶/微观信号后提交 daily/${TODAY}.md"
              echo ""
              echo "📋 检查清单：https://github.com/zfzfboom/us-equity-liquidity-monitor/blob/main/checklist/daily-checklist.md"
            fi
          } > message.txt

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(cat message.txt)" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "disable_web_page_preview=true"

          echo "Message sent successfully"
