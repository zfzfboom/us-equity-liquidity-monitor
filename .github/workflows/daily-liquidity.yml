name: Daily Liquidity Summary to Telegram

on:
  schedule:
    # 17:00 America/New_York = 22:00 UTC (EST) / 21:00 UTC (EDT)
    # Using 22:00 UTC for winter (November)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run fetch and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x scripts/fetch_and_send.sh
          bash scripts/fetch_and_send.sh
