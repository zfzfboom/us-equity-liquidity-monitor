name: Daily Liquidity Summary to Telegram

on:
  schedule:
    # UTC 23:00 每天（含周末），收盘后数据更完整，减少日期/数据滞后
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run fetch and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x scripts/fetch_and_send.sh
          bash scripts/fetch_and_send.sh
